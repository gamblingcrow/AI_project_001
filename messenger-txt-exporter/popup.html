<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 280px; margin: 12px; color: #1c1e21; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: inline-flex; align-items: center; gap: 6px; margin: 6px 0; }
    .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
    input[type=number] { width: 64px; }
    button { width: 100%; padding: 8px; margin-top: 8px; border: 0; border-radius: 6px;
             background: #0078ff; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { background: #9bbcf0; cursor: default; }
    #status { margin-top: 10px; min-height: 18px; white-space: pre-wrap; color: #444; }
    .hint { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Messenger chat export</h1>
  <div class="row">Save as
    <label><input type="radio" name="fmt" value="txt" checked> TXT</label>
    <label><input type="radio" name="fmt" value="pdf"> PDF</label>
    <label><input type="radio" name="fmt" value="both"> Both</label>
  </div>
  <label style="display:flex"><input type="checkbox" id="loadAll" checked> Scroll up to load older messages</label>
  <div class="row">Max scroll steps <input type="number" id="maxSteps" value="300" min="1" max="10000"></div>
  <label style="display:flex"><input type="checkbox" id="includeSeparators" checked> Include date/time separators</label>
  <button id="export">Export open chat</button>
  <div id="status"></div>
  <p class="hint">Open a conversation on messenger.com or facebook.com/messages first.
  Progress is shown on the page.<br>For PDF, a print dialog opens: choose <b>Save as PDF</b> as the printer. Pictures are included.</p>
  <script src="popup.js"></script>
</body>
</html>
